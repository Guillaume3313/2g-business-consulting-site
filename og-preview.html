<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
              --ink:#10151a; --paper:#f7f6f2; --brass:#b8813c; --brass-soft:#e0ab68; --pine:#3f6a5c;
        }
        *{box-sizing:border-box; margin:0; padding:0;}
        html,body{ background:var(--ink); }
        body{
              font-family:'Inter', sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;
        }
        .canvas{ width:1200px; height:630px; position:relative; overflow:hidden; flex:none; }
        .blob1{ position:absolute; width:480px; height:480px; top:-160px; right:-140px; border-radius:50%;
                   background:radial-gradient(circle, rgba(184,129,60,0.38), transparent 70%); filter:blur(30px); }
        .blob2{ position:absolute; width:420px; height:420px; bottom:-180px; left:-120px; border-radius:50%;
                   background:radial-gradient(circle, rgba(111,163,146,0.28), transparent 70%); filter:blur(30px); }
        .content{ position:relative; z-index:2; padding:80px 90px; }
        .logo{ width:84px; height:84px; border-radius:22px; background:var(--paper); display:flex; align-items:center; justify-content:center; margin-bottom:46px; }
        .logo svg{ width:46px; height:46px; }
        h1{ font-family:'Source Serif 4', serif; font-weight:600; font-size:60px; line-height:1.18; color:var(--paper); letter-spacing:-0.01em; max-width:920px; }
        .sub{ margin-top:26px; font-size:18px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--brass-soft); }
      </style>
  </head>
  <body>
      <div class="canvas">
            <div class="blob1"></div>
            <div class="blob2"></div>
            <div class="content">
                    <div class="logo">
                              <svg viewBox="0 0 688 516" xmlns="http://www.w3.org/2000/svg">
                                          <path fill="#b8813c" fill-rule="evenodd" d="M 526 116 L 416 113 L 178 335 L 114 278 L 117 265 L 172 210 L 226 257 L 260 232 L 179 150 L 161 153 L 55 258 L 50 277 L 155 389 L 178 396 L 432 126 Z"/>
                                          <path fill="#10151a" fill-rule="evenodd" d="M 605 268 L 497 156 L 471 151 L 220 420 L 105 431 L 232 440 L 479 213 L 536 280 L 481 336 L 425 286 L 391 316 L 470 398 L 487 399 L 601 290 Z"/>
                              </div>
                    </div>
                    <h1>Trois leviers concrets pour faire grandir votre entreprise.</h1>
                  <div class="sub">2G Business Consulting — Conseil stratégique &amp; apport d'affaires</div>
            </div>
      </div>
  </body>
</html>html></h1>
